name: Security

# Report-only security scanning. None of these jobs fail the build — they
# publish findings to the repo's Security tab (Code scanning) and/or job logs
# so they can be triaged without blocking PRs. Flip the per-tool exit codes /
# fail-build flags noted below once the baseline is clean to make them gating.
# A pull request from a fork gets a read-only token and cannot upload SARIF, so
# it only runs the scans; the upload steps check for that.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: "0 0 * * 1"

# Read-only by default. The jobs that publish findings to the Security tab
# (Code scanning) add `security-events: write` for themselves.
permissions:
  contents: read

jobs:
  # --- SAST -----------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan
        # --error is omitted, so a finding never fails the job (report-only).
        run: |
          semgrep scan \
            --sarif --output semgrep.sarif \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/github-actions
      # Semgrep keeps a finding silenced with `# nosemgrep` in the SARIF,
      # marked as suppressed, but code scanning opens an alert for it anyway.
      - name: Drop suppressed findings
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep.tmp
          mv semgrep.tmp semgrep.sarif
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- Secret scanning ------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the whole git log is scanned
      # The release archive is checked against its published checksum, so a
      # replaced download fails here instead of running.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        # --exit-code 0 keeps it report-only; --redact avoids printing secrets.
        run: |
          gitleaks detect \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 0
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # --- Filesystem: vulns + secrets + misconfig ------------------------------
  trivy:
    name: Trivy (fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0" # report-only
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy

  # --- Dependency vulnerabilities -------------------------------------------
  grype:
    name: Grype (dep CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          fail-build: false # report-only
          output-format: sarif
          output-file: grype.sarif
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype.sarif
          category: grype

  # --- SBOM (dependency inventory) ------------------------------------------
  syft:
    name: Syft (SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Attaches the SBOM as a build artifact (default behaviour).
          upload-artifact: true
