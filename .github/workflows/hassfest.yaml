name: Validate with hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# Only the checkout needs anything, and it only needs to read. Deliberately
# not the empty `permissions: {}` that validate.yaml uses — that works there
# because hacs/action clones via the API and the workflow has no checkout
# step; hassfest needs the files on disk.
permissions:
  contents: read

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26
