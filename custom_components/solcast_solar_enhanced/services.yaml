run_pv_tuning:
  name: Run PV Tuning
  description: >
    Force an immediate PV tilt/azimuth optimisation run using all available
    DB records. Requires the database feature to be enabled and sufficient
    clear-sky records.

run_dampening_update:
  name: Run Dampening Update
  description: >
    Force an immediate recalculation of the half-hourly shading dampening
    factors and push them to the base solcast_solar integration. Without the
    database there is no history to learn from, so every factor is a neutral
    1.0.

fetch_weather:
  name: Fetch Weather
  description: >
    Force an immediate refresh of every configured weather and irradiance
    source: Open-Meteo (keyless, on by default) and OpenWeatherMap if an API
    key is configured. Fails with an error if neither source is enabled.

compact_database:
  name: Compact Database
  description: >
    Drop the old-format history table once the new schema has proved itself, and
    reclaim its space (about three quarters of the file). Refuses unless the last
    seven days agree in both formats. After this, going back to 1.15.0b2 means
    restoring the pre-migration backup or running tools/downgrade_v2.py; the
    backup is deleted 30 days after compaction.
